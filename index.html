<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma Web de Juegos Educativos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white"
  >
    <!-- Header Principal -->
    <header
      class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md"
    >
      <div
        class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"
      >
        <div
          class="flex items-center space-x-3 cursor-pointer"
          onclick="navigateHome()"
        >
          <div
            class="bg-indigo-600 p-2 rounded-xl text-white font-black text-xl shadow-lg shadow-indigo-500/30"
          >
            EduCA
          </div>
          <div>
            <h1 class="font-bold text-lg tracking-tight">
              Juegos Educativos VZLA
            </h1>
            <p class="text-xs text-slate-400">
              Plataforma Oficial de Aprendizaje
            </p>
          </div>
        </div>

        <div id="nav-auth-section" class="flex items-center space-x-4">
          <!-- Se llena dinámicamente -->
        </div>
      </div>
    </header>

    <!-- Notificaciones flotantes -->
    <div
      id="notification-container"
      class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"
    ></div>

    <!-- Contenedor Principal Dinámico -->
    <main
      id="main-content"
      class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6"
    ></main>

    <!-- Footer -->
    <footer
      class="bg-slate-950 border-t border-slate-800 text-center py-4 text-xs text-slate-500"
    >
      Plataforma Web de Juegos Educativos &copy; 2026 — Prof. Ángel Contreras.
      Todos los derechos reservados.
    </footer>

    <!-- Script Principal -->
    <script src="js/app.js"></script>
  </body>
</html>
